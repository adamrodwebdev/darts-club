services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    environment: &app-env
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: https://${SERVER_NAME:-localhost}
      TRUSTED_ORIGINS: https://${SERVER_NAME:-localhost}
      DEFAULT_URI: https://${SERVER_NAME:-localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=17&charset=utf8
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
      MESSENGER_FAILED_TRANSPORT_DSN: redis://redis:6379/failed
      MAILER_DSN: smtp://mailer:1025
      MERCURE_URL: http://mercure/.well-known/mercure
      # Hub servi sur la même origine via Caddy (/.well-known/mercure)
      MERCURE_PUBLIC_URL: https://${SERVER_NAME:-localhost}/.well-known/mercure
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      SERVER_NAME: ${SERVER_NAME:-localhost}
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Avatars et photos d'événements : conservés entre deux déploiements
      - app_storage:/app/var/storage
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  # Messages asynchrones (emails, notifications) + tâches planifiées (relances)
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    command: ["php", "bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "--memory-limit=256M"]
    # La sonde de l'image interroge Caddy, absent de ce conteneur : sans objet ici
    healthcheck:
      disable: true
    environment: *app-env
    restart: unless-stopped
    volumes:
      - app_storage:/app/var/storage
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql/data

  mercure:
    image: dunglas/mercure:v0.21
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
    volumes:
      - mercure_data:/data
      - mercure_config:/config

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  app_storage:
  caddy_data:
  caddy_config:
  database_data:
  redis_data:
  mercure_data:
  mercure_config:
