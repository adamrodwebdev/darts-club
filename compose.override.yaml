# Développement uniquement
services:
  php:
    build:
      target: dev
    volumes:
      - ./api:/app
    environment: &dev-env
      APP_ENV: dev
      FRONTEND_URL: http://localhost:5173
      TRUSTED_ORIGINS: http://localhost:5173
      DEFAULT_URI: http://localhost:5173
      MERCURE_PUBLIC_URL: http://localhost:3000/.well-known/mercure

  worker:
    build:
      target: dev
    volumes:
      - ./api:/app
    environment: *dev-env

  # Dev : front servi par Vite (localhost:5173), hub exposé sur le port 3000
  mercure:
    environment:
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:5173
    ports:
      - "3000:80"

  database:
    ports:
      - "5432:5432"

  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
