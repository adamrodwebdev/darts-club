expose_php = Off
display_errors = Off
memory_limit = 256M
upload_max_filesize = 11M
; 10 photos de 10 Mo maximum par envoi
post_max_size = 112M

opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
; Préchargement des classes Symfony au démarrage
opcache.preload = /app/config/preload.php
opcache.preload_user = www-data
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Progression des envois par la session : inutile ici, et chemin des failles PHP2Shell
; (CVE-2026-109619) et CVE-2026-115560 : coupée
session.upload_progress.enabled = 0
; 10 photos au plus par envoi (l'API refuse au-delà)
max_file_uploads = 10

session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
