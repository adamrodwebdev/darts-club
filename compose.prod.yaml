# Production : docker compose -f compose.yaml -f compose.prod.yaml up -d
# L'image est construite par GitHub Actions (workflow « Déploiement ») et publiée
# sur ghcr.io ; le serveur ne compile rien. Variables : fichier .env du serveur
# (modèle : deploy/.env.example), jamais commité.
x-prod-env: &prod-env
  APP_ENV: prod
  APP_SECRET: ${APP_SECRET:?définir APP_SECRET dans .env}
  DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-app}?serverVersion=17&charset=utf8
  MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?définir MERCURE_JWT_SECRET}
  TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?définir TWO_FACTOR_ENCRYPTION_KEY}
  MAILER_DSN: ${MAILER_DSN:?définir MAILER_DSN (SMTP Brevo)}
  MAILER_FROM: ${MAILER_FROM:?définir MAILER_FROM}
  # Redis exige un mot de passe (deploy.sh le tire sur le serveur) : y écrire suffirait, sinon, à exécuter du
  # code dans l'API et le worker, qui y relisent sessions et messages par unserialize()
  REDIS_URL: redis://${REDIS_PASSWORD:?définir REDIS_PASSWORD (créé par deploy.sh)}@redis:6379
  MESSENGER_TRANSPORT_DSN: redis://${REDIS_PASSWORD:?définir REDIS_PASSWORD}@redis:6379/messages
  MESSENGER_FAILED_TRANSPORT_DSN: redis://${REDIS_PASSWORD:?définir REDIS_PASSWORD}@redis:6379/failed
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:${MAILER_FROM}}
  OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
  OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
  OAUTH_DISCORD_CLIENT_ID: ${OAUTH_DISCORD_CLIENT_ID:-}
  OAUTH_DISCORD_CLIENT_SECRET: ${OAUTH_DISCORD_CLIENT_SECRET:-}
  # Même origine : aucune autre origine n'a besoin de CORS (le réglage de développement ne passe pas
  # en production). Expression « ^$ », le $ doublé pour Compose
  CORS_ALLOW_ORIGIN: '^$$'

# Aucun conteneur ne peut regagner de privilèges (programme setuid, capacités de fichier)
x-no-new-privileges: &no-new-privileges
  security_opt: ["no-new-privileges:true"]

services:
  # Plafonds de mémoire et de processus : une conversion ou un envoi qui s'emballe ne peut pas pousser le
  # noyau à tuer PostgreSQL faute de mémoire (réglables dans .env selon la taille du serveur)
  php:
    image: ${IMAGE:-ghcr.io/adamrodwebdev/darts-club}:${IMAGE_TAG:-latest}
    build: !reset null
    environment: *prod-env
    networks: !override [default, data, hub]
    <<: *no-new-privileges
    # Seule capacité gardée : écouter les ports 80 et 443 (www-data, sans root)
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    mem_limit: ${WEB_MEMORY_LIMIT:-2g}
    pids_limit: 512
    logging: &logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  worker:
    image: ${IMAGE:-ghcr.io/adamrodwebdev/darts-club}:${IMAGE_TAG:-latest}
    build: !reset null
    environment: *prod-env
    networks: !override [default, data, hub]
    <<: *no-new-privileges
    cap_drop: [ALL]
    # ffmpeg et le traitement des photos : bornés ici, le site garde sa mémoire
    mem_limit: ${WORKER_MEMORY_LIMIT:-1536m}
    pids_limit: 256
    logging: *logs

  # Base et Redis sur un réseau interne : ni accès à Internet (rien à télécharger ni à exfiltrer depuis
  # eux), ni contact avec Mercure
  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
    networks: !override [data]
    <<: *no-new-privileges
    pids_limit: 256
    logging: *logs

  # Hub sur son propre réseau interne : joint par Caddy (php) et le worker, sans accès à Internet
  mercure:
    environment:
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?définir MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?définir MERCURE_JWT_SECRET}
    networks: !override [hub]
    <<: *no-new-privileges
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    mem_limit: 512m
    pids_limit: 256
    logging: *logs

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?définir REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    networks: !override [data]
    <<: *no-new-privileges
    pids_limit: 128
    logging: *logs

networks:
  data:
    internal: true
  hub:
    internal: true
