name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, actions
          queries: security-extended
      # Dépôt privé sans GitHub Advanced Security : pas d'envoi à GitHub,
      # les résultats SARIF sont analysés ici et publiés en artefact.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: sarif-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: sarif-results
      - name: Échec si CodeQL signale un problème
        run: |
          count=$(jq '[.runs[].results[]] | length' sarif-results/*.sarif | paste -sd+ | bc)
          jq -r '.runs[].results[] | "\(.ruleId): \(.message.text) (\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine))"' sarif-results/*.sarif
          test "$count" -eq 0
