name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Symfony)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, redis, gmp, gd
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('api/composer.lock') }}
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress
      - run: composer audit
      - run: vendor/bin/php-cs-fixer check --diff
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: bin/console lint:container
      - run: bin/console lint:yaml config
      - name: Migrations + validation du schéma (PostgreSQL)
        env:
          MESSENGER_TRANSPORT_DSN: in-memory://
          MESSENGER_FAILED_TRANSPORT_DSN: in-memory://
        run: |
          bin/console doctrine:database:create --if-not-exists
          bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          bin/console doctrine:schema:validate
      - run: vendor/bin/phpunit

  web:
    name: Web (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npx oxlint . && npx eslint .
      - run: npm run type-check
      - run: npx vitest run
      - run: npm run build-only
      - name: Budget de performance (JS/CSS gzip)
        run: npm run budget
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  e2e:
    name: E2E (Playwright, desktop + mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build-only
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  docker:
    name: Image de production (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configuration Compose de production valide
        env:
          APP_SECRET: ci
          POSTGRES_PASSWORD: ci
          MERCURE_JWT_SECRET: ci
          TWO_FACTOR_ENCRYPTION_KEY: ci
          MAILER_DSN: null://null
          MAILER_FROM: ci@example.com
        run: docker compose -f compose.yaml -f compose.prod.yaml config --quiet
      - name: Construction de l'image (front Vite + API Symfony + FrankenPHP)
        run: docker build --target prod -f docker/php/Dockerfile -t skull-darts-71:ci .
      - name: Configuration Caddy valide
        run: docker run --rm skull-darts-71:ci frankenphp validate --config /etc/frankenphp/Caddyfile
      - name: Conteneur Symfony valide en production
        run: docker run --rm -e APP_SECRET=ci-check skull-darts-71:ci php bin/console lint:container
      # Hub lancé avec la configuration Compose de production (émetteur de confiance, audience) : les
      # jetons de l'API doivent y être acceptés et une publication privée reçue par un abonné
      - name: Hub Mercure accepte les jetons de l'API
        env:
          SERVER_NAME: ci.example
          APP_SECRET: ci
          POSTGRES_PASSWORD: ci
          MERCURE_JWT_SECRET: ci-mercure-secret-key-of-at-least-32-bytes
          TWO_FACTOR_ENCRYPTION_KEY: ci
          MAILER_DSN: null://null
          MAILER_FROM: ci@example.com
        run: |
          compose="docker compose -f compose.yaml -f compose.prod.yaml"
          $compose up -d mercure
          network=$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "$($compose ps -q mercure)")
          check() {
            docker run --rm --network "$network" -e APP_SECRET=ci-check -e MERCURE_JWT_SECRET \
              -e MERCURE_URL=http://mercure/.well-known/mercure -e MERCURE_PUBLIC_URL=https://ci.example/.well-known/mercure \
              skull-darts-71:ci php bin/console app:realtime:check
          }
          # Le hub met quelques secondes à écouter : jusqu'à cinq essais
          for attempt in 1 2 3 4 5; do check && ok=1 && break; sleep 3; done
          $compose logs mercure | tail -n 30
          test "${ok:-0}" = 1
      - name: Aucun fichier local ni secret dans l'image
        run: |
          docker run --rm skull-darts-71:ci sh -c 'ls -a /app; test ! -e /app/.env.local && test ! -e /app/.env.dev.local && test -f /app/web/index.html'

  lighthouse:
    name: Lighthouse (100)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      # vite preview : routes de la SPA (/connexion…) servies comme en production ; ses appels
      # d'API vont au bouchon (web/lighthouse/api-stub.mjs). Lancés une fois pour toute la mesure.
      - name: Serveurs de la mesure
        run: |
          node web/lighthouse/api-stub.mjs &
          npm --prefix web run preview -- --port 4173 --strictPort &
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:4173/; do sleep 1; done'
        env:
          VITE_API_PROXY: http://127.0.0.1:8787
      # Premiers passages sur une machine neuve (Chrome, Node et disque froids) : bien plus lents que les
      # suivants (0,71 à 0,80 contre 0,99 à 1 sur la même page, quatre CI de suite), et la lenteur dure
      # parfois trois passages (accueil à 220, 120, 90 puis 30 ms de blocage, contre 10 ms à chaque passage
      # sur le même code deux heures plus tôt). Ils préparent la machine et ne sont pas comptés ; les trois
      # passages de chaque page qui suivent le sont, le pire décide.
      - name: Préchauffage (non compté)
        run: |
          npx --yes @lhci/cli@0.15.x collect --url=http://localhost:4173/ --numberOfRuns=3
          node web/lighthouse/summary.mjs
          rm -rf .lighthouseci
      - run: npx --yes @lhci/cli@0.15.x autorun
      - name: Résumé de chaque passage
        if: always()
        run: node web/lighthouse/summary.mjs
      # Échec : tous les passages (seul le médian est publié), pour lire celui qui a échoué
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lighthouse-runs
          path: .lighthouseci/lhr-*.json
          # Dossier caché, ignoré sans cette option
          include-hidden-files: true
          retention-days: 7
