name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Symfony)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, redis, gmp, gd
          coverage: none
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('api/composer.lock') }}
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress
      - run: composer audit
      - run: vendor/bin/php-cs-fixer check --diff
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: bin/console lint:container
      - run: bin/console lint:yaml config
      - name: Migrations + validation du schéma (PostgreSQL)
        env:
          MESSENGER_TRANSPORT_DSN: in-memory://
          MESSENGER_FAILED_TRANSPORT_DSN: in-memory://
        run: |
          bin/console doctrine:database:create --if-not-exists
          bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          bin/console doctrine:schema:validate
      - run: vendor/bin/phpunit

  web:
    name: Web (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npx oxlint . && npx eslint .
      - run: npm run type-check
      - run: npx vitest run
      - run: npm run build-only
      - name: Budget de performance (JS/CSS gzip)
        run: npm run budget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist

  e2e:
    name: E2E (Playwright, desktop + mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build-only
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  docker:
    name: Image de production (Docker)
    runs-on: ubuntu-latest
    # Secrets factices pour la configuration Compose de production (jamais ceux du serveur)
    env:
      APP_SECRET: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_APP_PASSWORD: ci_app_password
      MERCURE_JWT_SECRET: ci-mercure-secret-key-of-at-least-32-bytes
      TWO_FACTOR_ENCRYPTION_KEY: ci
      MAILER_DSN: null://null
      MAILER_FROM: ci@example.com
      REDIS_PASSWORD: ci-redis-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configuration Compose de production valide
        run: docker compose -f compose.yaml -f compose.prod.yaml config --quiet
      - name: Construction de l'image (front Vite + API Symfony + FrankenPHP)
        run: docker build --target prod -f docker/php/Dockerfile -t skull-darts-71:ci .
      - name: Configuration Caddy valide
        run: docker run --rm skull-darts-71:ci frankenphp validate --config /etc/frankenphp/Caddyfile
      - name: Conteneur Symfony valide en production
        run: docker run --rm -e APP_SECRET=ci-check skull-darts-71:ci php bin/console lint:container
      # Le ffmpeg de l'image convertit chaque format de téléphone et refuse un décodeur hors de la liste
      # (vidéos d'essai fabriquées sur place, conversion par le vrai code du worker)
      - name: Galerie vidéo (formats des téléphones, décodeurs limités)
        run: docker run --rm -e APP_SECRET=ci-check skull-darts-71:ci php bin/console app:media:check
      # Réglages lus par le vrai serveur web de l'image (sonde montée à la place de index.php) : aucune
      # fonction qui lance un programme, valeurs PHP de production. Le worker, en ligne de commande, garde
      # proc_open pour ffmpeg
      - name: Réglages PHP du site et du worker
        run: |
          docker run -d --name web-probe -e SERVER_NAME=localhost -e APP_SECRET=ci-check -p 8443:443 \
            -v "$PWD/.github/ci/php-web-probe.php:/app/public/index.php:ro" skull-darts-71:ci
          for attempt in $(seq 1 30); do probe=$(curl -fsSk https://localhost:8443/api/probe) && break; sleep 1; done
          docker logs web-probe 2>&1 | tail -n 15
          docker rm -f web-probe > /dev/null
          echo "${probe:-aucune réponse}"
          echo "$probe" | jq -e '.sapi == "frankenphp" and .enabled == [] and .exception_ignore_args == "1"
            and (.register_argc_argv == "" or .register_argc_argv == "0") and .use_strict_mode == "1"
            and (.display_errors == "" or .display_errors == "0")'
          docker run --rm skull-darts-71:ci php -r 'exit(function_exists("proc_open") ? 0 : 1);'
      # Fichiers du front servis par le vrai Caddyfile de l'image : le fichier versionné disparu que demande
      # un onglet ouvert avant un déploiement répond 404 sans cache, jamais la page d'accueil gardée un an
      - name: Fichiers du front (un fichier disparu répond 404)
        run: |
          docker run -d --name web-files -e SERVER_NAME=localhost -e APP_SECRET=ci-check -p 8444:443 skull-darts-71:ci
          for attempt in $(seq 1 30); do curl -fsSk -o /dev/null https://localhost:8444/ && break; sleep 1; done
          headers() { curl -sSk -o /dev/null -D - "https://localhost:8444$1" | tr -d '\r' | tr '[:upper:]' '[:lower:]'; }
          asset=$(docker exec web-files sh -c 'cd /app/web/assets && ls *.js | head -n 1')
          page=$(headers /evenements)
          present=$(headers "/assets/$asset")
          gone=$(headers /assets/disparu-0000000.js)
          sound=$(headers /audio/disparu.mp3)
          docker rm -f web-files > /dev/null
          printf '%s\n\n' "$page" "$present" "$gone" "$sound"
          echo "$page" | grep -qE '^http/[0-9.]+ 200'
          echo "$page" | grep -q '^content-type: text/html'
          echo "$page" | grep -q '^cache-control: no-cache'
          echo "$present" | grep -qE '^http/[0-9.]+ 200'
          echo "$present" | grep -q '^cache-control: public, max-age=31536000, immutable'
          echo "$gone" | grep -qE '^http/[0-9.]+ 404'
          echo "$gone" | grep -q '^cache-control: no-store'
          echo "$sound" | grep -qE '^http/[0-9.]+ 404'
          if echo "$gone" | grep -q '^content-type: text/html'; then echo 'fichier disparu servi comme une page'; exit 1; fi
      # Hub lancé avec la configuration Compose de production (émetteur de confiance, audience) : les
      # jetons de l'API doivent y être acceptés et une publication privée reçue par un abonné
      - name: Hub Mercure accepte les jetons de l'API
        env:
          SERVER_NAME: ci.example
        run: |
          compose="docker compose -f compose.yaml -f compose.prod.yaml"
          $compose up -d mercure
          network=$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "$($compose ps -q mercure)")
          check() {
            docker run --rm --network "$network" -e APP_SECRET=ci-check -e MERCURE_JWT_SECRET \
              -e MERCURE_URL=http://mercure/.well-known/mercure -e MERCURE_PUBLIC_URL=https://ci.example/.well-known/mercure \
              skull-darts-71:ci php bin/console app:realtime:check
          }
          # Le hub met quelques secondes à écouter : jusqu'à cinq essais
          for attempt in 1 2 3 4 5; do check && ok=1 && break; sleep 3; done
          $compose logs mercure | tail -n 30
          test "${ok:-0}" = 1
      # La pile entière telle que le serveur la lance (deploy.sh) : réseaux internes, Redis à mot de passe,
      # capacités retirées, aucun gain de privilège, plafonds de mémoire. Le durcissement ne doit rien casser
      - name: Pile de production complète et durcie
        env:
          IMAGE: skull-darts-71
          IMAGE_TAG: ci
          SERVER_NAME: localhost
        run: |
          export TWO_FACTOR_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          compose="docker compose -f compose.yaml -f compose.prod.yaml"
          networks() { docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' "$($compose ps -q "$1")"; }
          $compose up -d --wait database redis mercure
          # Comme deploy.sh : migrations par le propriétaire des tables, puis compte limité du site (deux fois :
          # le script doit pouvoir se relancer)
          DATABASE_URL="postgresql://app:${POSTGRES_PASSWORD}@database:5432/app?serverVersion=17&charset=utf8" \
            $compose run --rm --no-deps -e DATABASE_URL php php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          deploy/database-role.sh
          deploy/database-role.sh
          $compose up -d php worker
          for attempt in $(seq 1 30); do body=$(curl -fsSk https://localhost/api/health) && break; sleep 2; done
          $compose ps
          $compose logs --tail 20 php worker
          test "$body" = '{"status":"ok"}'
          # Le site joint la base avec le compte limité et son mot de passe. Ce compte lit et écrit chaque table
          # (celles des migrations à venir comprises), mais n'est pas superutilisateur, ne crée aucune table, ne
          # lance aucune commande du système et ne voit pas la table des migrations
          $compose exec -T php php bin/console dbal:run-sql 'SELECT current_user' | grep -q app_runtime
          as_owner() { $compose exec -T database psql -X -At -v ON_ERROR_STOP=1 -U app -d app -c "$1"; }
          as_site() { $compose exec -T database psql -X -At -v ON_ERROR_STOP=1 -U app_runtime -d app -c "$1"; }
          as_owner 'CREATE TABLE ci_future (id int GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, label text)'
          test "$(as_site "SELECT rolsuper OR rolcreatedb OR rolcreaterole OR rolbypassrls FROM pg_roles WHERE rolname = current_user")" = f
          test "$(as_site "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'")" -gt 10
          test "$(as_site "SELECT count(*) FROM pg_tables t, unnest(ARRAY['SELECT', 'INSERT', 'UPDATE', 'DELETE']) p
            WHERE t.schemaname = 'public' AND t.tablename <> 'doctrine_migration_versions'
            AND NOT has_table_privilege(format('%I.%I', t.schemaname, t.tablename), p)")" = 0
          as_site "INSERT INTO ci_future (label) VALUES ('a'); UPDATE ci_future SET label = 'b'; DELETE FROM ci_future"
          for denied in 'CREATE TABLE ci_probe (id int)' 'DROP TABLE ci_future' 'ALTER TABLE ci_future ADD COLUMN x int' \
            "COPY (SELECT 1) TO PROGRAM 'true'" 'SELECT count(*) FROM doctrine_migration_versions'; do
            if as_site "$denied" 2> /dev/null; then echo "::error::compte du site autorisé à : $denied"; exit 1; fi
          done
          as_owner 'DROP TABLE ci_future'
          # Le site joint Redis avec le mot de passe ; sans lui, Redis refuse tout
          $compose exec -T php php bin/console cache:pool:clear cache.app
          $compose exec -T redis redis-cli ping | grep -q NOAUTH
          # Base, Redis et hub sans accès à Internet ; le site, lui, l'a (emails, notifications)
          for service in database redis mercure; do
            for network in $(networks "$service"); do
              if docker run --rm --network "$network" --entrypoint curl skull-darts-71:ci -sS -m 5 -o /dev/null http://1.1.1.1; then
                echo "::error::$service : le réseau $network atteint Internet"; exit 1
              fi
            done
          done
          docker run --rm --network "$(networks php | tr ' ' '\n' | grep '_default$')" --entrypoint curl skull-darts-71:ci -sS -m 10 -o /dev/null http://1.1.1.1
          # Aucun conteneur ne peut regagner de privilèges ; le worker tient (file Redis lue avec le mot de passe)
          for service in php worker database redis mercure; do
            docker inspect -f '{{.HostConfig.SecurityOpt}}' "$($compose ps -q "$service")" | grep -q no-new-privileges
          done
          sleep 5
          test "$(docker inspect -f '{{.RestartCount}} {{.State.Running}}' "$($compose ps -q worker)")" = "0 true"
      - name: Aucun fichier local ni secret dans l'image
        run: |
          docker run --rm skull-darts-71:ci sh -c 'ls -a /app; test ! -e /app/.env.local && test ! -e /app/.env.dev.local && test -f /app/web/index.html'
      # Le serveur tire ces fichiers de l'image (deploy/ssh-gate.sh) : sans eux, aucun déploiement possible.
      # Les commandes imposées des clés SSH doivent rester exécutables
      - name: Fichiers de déploiement dans l'image
        run: |
          docker run --rm skull-darts-71:ci sh -c 'cd /app/ops && test -f compose.yaml && test -f compose.prod.yaml \
            && test -x deploy/deploy.sh && test -x deploy/ssh-gate.sh && test -x deploy/backup-share.sh \
            && test -x deploy/authorize-github-key.sh && test -x deploy/database-role.sh && sh -n deploy/ssh-gate.sh \
            && sh -n deploy/authorize-github-key.sh && sh -n deploy/server-setup.sh && sh -n deploy/database-role.sh'

  lighthouse:
    name: Lighthouse (100)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      # vite preview : routes de la SPA (/connexion…) servies comme en production ; ses appels
      # d'API vont au bouchon (web/lighthouse/api-stub.mjs), qui sert aussi la page sonde du calage
      # (/sonde). Lancés une fois pour toute la mesure.
      - name: Serveurs de la mesure
        run: |
          node web/lighthouse/api-stub.mjs &
          npm --prefix web run preview -- --port 4173 --strictPort &
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:4173/ && curl -sf -o /dev/null http://127.0.0.1:8787/sonde; do sleep 1; done'
        env:
          VITE_API_PROXY: http://127.0.0.1:8787
      # Premiers passages sur une machine neuve (Chrome, Node et disque froids) : bien plus lents que les
      # suivants (0,71 à 0,80 contre 0,99 à 1 sur la même page, quatre CI de suite), et la lenteur dure
      # parfois trois passages (accueil à 220, 120, 90 puis 30 ms de blocage, contre 10 ms à chaque passage
      # sur le même code deux heures plus tôt). Ils préparent la machine et ne sont pas comptés ; les trois
      # passages de chaque page qui suivent le sont, le pire décide. Ils mesurent aussi la vitesse de la
      # machine, sur laquelle le ralentissement du processeur est calé (web/lighthouse/calibrate.mjs), avec
      # deux horloges dont la plus douce l'emporte : l'indice JavaScript de Lighthouse sur l'accueil, puis
      # le travail propre du navigateur sur une page sonde fixe (création de la page et de son contexte
      # JavaScript, lecture du HTML). Une machine rapide en JavaScript peut être lente pour le reste
      # (PR #128 : indice 4050, donc 6,48×, et 99 sur /en par une tâche du navigateur de 179 ms).
      - name: Préchauffage (non compté)
        run: |
          npx --yes @lhci/cli@0.15.x collect --url=http://localhost:4173/ --url=http://127.0.0.1:8787/sonde --numberOfRuns=3
          node web/lighthouse/summary.mjs
          node web/lighthouse/calibrate.mjs >> "$GITHUB_ENV"
          rm -rf .lighthouseci
      # Le premier passage de chaque page restait le plus lent, même après le préchauffage de l'accueil :
      # 7 des 8 échecs du 4 au 6 novembre 2026 tombaient sur le premier des trois passages de /connexion
      # (190 à 460 ms de blocage, puis 0 à 30 ms aux deux suivants), sur les trois types de machine. Chaque
      # passage part d'un Chrome au profil vide : seuls la machine et les serveurs de la mesure ont déjà vu
      # la page. Un passage non compté sur chaque page de lighthouserc.json, au ralentissement calé.
      - name: Préchauffage de chaque page (non compté)
        run: |
          npx --yes @lhci/cli@0.15.x collect --numberOfRuns=1 --settings.throttling.cpuSlowdownMultiplier="$LIGHTHOUSE_CPU_SLOWDOWN"
          node web/lighthouse/summary.mjs
          rm -rf .lighthouseci
      # Le même téléphone simulé quelle que soit la machine tirée, jamais plus lent que la cible
      - run: npx --yes @lhci/cli@0.15.x autorun --collect.settings.throttling.cpuSlowdownMultiplier="$LIGHTHOUSE_CPU_SLOWDOWN"
      - name: Résumé de chaque passage
        if: always()
        run: node web/lighthouse/summary.mjs
      # Échec : tous les passages (seul le médian est publié), pour lire celui qui a échoué
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: lighthouse-runs
          path: .lighthouseci/lhr-*.json
          # Dossier caché, ignoré sans cette option
          include-hidden-files: true
          retention-days: 7
