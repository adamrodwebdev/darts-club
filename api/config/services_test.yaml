# Doubles de test : aucune requête réseau (hub Mercure, Web Push)
services:
    _defaults:
        autowire: true
        public: true

    App\Tests\Double\:
        resource: '../tests/Double/'

    App\Notification\Push\PushSender: '@App\Tests\Double\FakePushSender'

    # Pas encore utilisé par un contrôleur (diffusions du président : étape 7)
    App\Notification\MemberNotifier: ~

    # Horloge figée : saison 2026-2027, échéance du 1er octobre dépassée
    clock:
        class: Symfony\Component\Clock\MockClock
        arguments: ['2026-10-15 12:00:00']
