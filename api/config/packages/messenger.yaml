framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: '%env(MESSENGER_FAILED_TRANSPORT_DSN)%'

        routing:
            App\Message\SendVerificationEmail: async
            App\Message\SendAccountExistsEmail: async
            App\Message\SendProviderLinkedEmail: async
            App\Message\SendPasswordResetEmail: async
            App\Message\SendMemberApprovedEmail: async
            App\Message\SendPasskeyNotice: async
            App\Message\Notify: async
            App\Message\DeliverNotification: async
            # Conversions de la galerie : dans le worker, jamais pendant une requête du site
            App\Message\TranscodeVideo: async
            App\Message\CompressVideo: async
            App\Message\OptimizeEventPhotos: async

when@test:
    framework:
        messenger:
            transports:
                async: 'sync://'
                failed: 'in-memory://'
