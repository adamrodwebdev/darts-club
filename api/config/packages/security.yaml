security:
    password_hashers:
        # Argon2id (libsodium)
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: sodium

    role_hierarchy:
        ROLE_MEMBER: ROLE_USER
        ROLE_SECRETARY: ROLE_MEMBER
        ROLE_TREASURER: ROLE_MEMBER
        ROLE_PRESIDENT: [ROLE_SECRETARY, ROLE_TREASURER]
        ROLE_ADMIN: ROLE_PRESIDENT

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            entry_point: App\Security\JsonAuthenticationEntryPoint
            custom_authenticators:
                - App\Security\OAuthAuthenticator
            json_login:
                check_path: auth_login
                username_path: email
                password_path: password
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: auth_logout
                invalidate_session: true
                clear_site_data: ['cookies', 'storage']

    access_control:
        - { path: ^/api/auth/(login|register|verify|verify/resend)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/oauth/, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Coût minimal en test uniquement
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: sodium
                time_cost: 3
                memory_cost: 10
