security:
    password_hashers:
        # Argon2id (libsodium)
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: sodium

    role_hierarchy:
        ROLE_MEMBER: ROLE_USER
        ROLE_SECRETARY: ROLE_MEMBER
        ROLE_TREASURER: ROLE_MEMBER
        ROLE_PRESIDENT: [ROLE_SECRETARY, ROLE_TREASURER]
        ROLE_ADMIN: ROLE_PRESIDENT

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            entry_point: App\Security\JsonAuthenticationEntryPoint
            custom_authenticators:
                - App\Security\OAuthAuthenticator
            json_login:
                check_path: auth_login
                username_path: email
                password_path: password
                success_handler: App\Security\TwoFactor\JsonTwoFactorHandlers
                failure_handler: App\Security\JsonLoginFailureHandler
            two_factor:
                check_path: auth_2fa_check
                auth_form_path: auth_2fa
                auth_code_parameter_name: code
                post_only: true
                prepare_on_login: true
                prepare_on_access_denied: true
                success_handler: App\Security\TwoFactor\JsonTwoFactorHandlers
                failure_handler: App\Security\TwoFactor\JsonTwoFactorHandlers
                authentication_required_handler: App\Security\TwoFactor\JsonTwoFactorHandlers
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: auth_logout
                invalidate_session: true
                clear_site_data: ['cookies', 'storage']

    access_control:
        - { path: ^/api/auth/(login|register|verify|verify/resend)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/oauth/, roles: PUBLIC_ACCESS }
        # Sonde de disponibilité
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        # Abonnement calendrier : authentifié par jeton secret, sans session
        - { path: '^/api/calendar/[a-f0-9]{48}\.ics$', roles: PUBLIC_ACCESS }
        # Pendant la saisie du code 2FA, seules ces routes sont accessibles
        - { path: ^/api/auth/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/(2fa|2fa/check)$, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Coût minimal en test uniquement
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: sodium
                time_cost: 3
                memory_cost: 10
