framework:
    rate_limiter:
        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        verification_resend:
            policy: fixed_window
            limit: 3
            interval: '1 hour'
        sensitive_action:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        message_post:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        two_factor_check:
            policy: fixed_window
            limit: 5
            interval: '5 minutes'
        # Par compte, toutes sessions confondues : reconnexions successives sans effet
        two_factor_account:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Réponses sans compte : par adresse IP et par email (envoi d'un lien)
        guest_response_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        guest_response_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        guest_token:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        # Mesure d'audience : au-delà, les vues sont ignorées sans erreur
        event_view:
            policy: sliding_window
            limit: 120
            interval: '1 hour'
        photo_upload:
            policy: sliding_window
            limit: 60
            interval: '1 hour'
