# Clés par origine : adresse IPv4 ou réseau /64 en IPv6 (App\Security\ClientNetwork)
framework:
    rate_limiter:
        # Connexion (App\Security\NetworkLoginRateLimiter) : par compte et origine, puis par origine
        login_account:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        login_network:
            policy: fixed_window
            limit: 25
            interval: '15 minutes'
        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        verification_resend:
            policy: fixed_window
            limit: 3
            interval: '1 hour'
        # Emails déclenchés sans connexion (App\Security\ThrottledMailer) : par destinataire, puis en tout
        visitor_email_recipient:
            policy: sliding_window
            limit: 4
            interval: '1 day'
        visitor_email_daily:
            policy: fixed_window
            limit: 100
            interval: '1 day'
        avatar_upload:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        push_subscription:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        sensitive_action:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        message_post:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        two_factor_check:
            policy: fixed_window
            limit: 5
            interval: '5 minutes'
        # Par compte, toutes sessions confondues : reconnexions successives sans effet
        two_factor_account:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Réponses sans compte : par adresse IP et par email (envoi d'un lien)
        guest_response_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        guest_response_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        guest_token:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        # Confirmations de réponses sans compte, par événement : un robot ne remplit pas toutes les places
        guest_confirm_event:
            policy: sliding_window
            limit: 30
            interval: '1 day'
        # Mesure d'audience : au-delà, les vues sont ignorées sans erreur
        event_view:
            policy: sliding_window
            limit: 120
            interval: '1 hour'
        photo_upload:
            policy: sliding_window
            limit: 60
            interval: '1 hour'

when@test:
    framework:
        rate_limiter:
            # Plafond observable dans les tests (même règle, seuil réduit)
            guest_confirm_event:
                policy: sliding_window
                limit: 3
                interval: '1 day'
